<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coca-Cola | Siente el Sabor</title>
    <!-- Favicon e Iconos -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* --- VARIABLES Y CONFIGURACIÓN BASE --- */
        :root {
            --coca-red: #e31837;
            --coca-dark: #0f0f0f;
            --coca-white: #ffffff;
            --zero-black: #111111;
            --light-bg: #f4f4f4;
            --transition: all 0.4s ease-in-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--coca-dark);
            color: var(--coca-white);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- NAVEGACIÓN --- */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 30px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--coca-white);
            text-decoration: none;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .logo span {
            color: var(--coca-red);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 35px;
        }

        .nav-links a {
            color: var(--coca-white);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--coca-red);
        }

        /* --- CONTENEDOR PRINCIPAL / HERO --- */
        .hero {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 100px 8% 50px 8%;
            background: radial-gradient(circle at 70% 50%, #44070f 0%, var(--coca-dark) 70%);
            transition: var(--transition);
        }

        .hero.zero-mode {
            background: radial-gradient(circle at 70% 50%, #222 0%, #000 70%);
        }

        .content {
            max-width: 550px;
            position: relative;
            z-index: 10;
        }

        .content h1 {
            font-size: 4.5rem;
            line-height: 1.1;
            font-weight: 800;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .content p {
            font-size: 1.1rem;
            margin-bottom: 35px;
            line-height: 1.6;
            color: #ccc;
        }

        /* --- BOTONES --- */
        .btn-container {
            display: flex;
            gap: 20px;
        }

        .btn {
            display: inline-block;
            padding: 14px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition);
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--coca-red);
            color: var(--coca-white);
            border: 2px solid var(--coca-red);
            box-shadow: 0 8px 25px rgba(227, 24, 55, 0.4);
        }

        .btn-primary:hover {
            background-color: transparent;
            color: var(--coca-red);
            box-shadow: 0 8px 25px rgba(227, 24, 55, 0.1);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--coca-white);
            border: 2px solid var(--coca-white);
        }

        .btn-secondary:hover {
            background-color: var(--coca-white);
            color: var(--coca-dark);
        }

        /* --- IMAGEN PRINCIPAL Y ANIMACIÓN --- */
        .image-box {
            position: absolute;
            right: 10%;
            bottom: 10%;
            height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        .main-product {
            height: 100%;
            object-fit: contain;
            transform: rotate(-10deg);
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.7));
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.5s;
        }

        .image-box:hover .main-product {
            transform: rotate(0deg) scale(1.05);
        }

        /* --- MINIATURAS INTERACTIVAS --- */
        .thumbnails {
            position: absolute;
            bottom: 40px;
            left: 8%;
            display: flex;
            gap: 20px;
            z-index: 20;
        }

        .thumb {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: var(--transition);
        }

        .thumb:hover, .thumb.active {
            border-color: var(--coca-red);
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
        }

        .thumb img {
            height: 85%;
            object-fit: contain;
        }

        /* --- REDES SOCIALES --- */
        .sci {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 25px;
            z-index: 20;
        }

        .sci a {
            color: var(--coca-white);
            font-size: 1.5rem;
            transition: var(--transition);
        }

        .sci a:hover {
            color: var(--coca-red);
            transform: scale(1.2);
        }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 992px) {
            header { padding: 20px 5%; }
            .hero { padding: 120px 5% 50px 5%; flex-direction: column; justify-content: flex-start; text-align: center; }
            .content { max-width: 100%; margin-top: 40px; }
            .content h1 { font-size: 3rem; }
            .btn-container { justify-content: center; }
            .image-box { position: relative; right: auto; bottom: auto; height: 45vh; margin-top: 40px; }
            .thumbnails { left: 50%; transform: translateX(-50%); bottom: 20px; }
            .sci { position: relative; direction: ltr; flex-direction: row; justify-content: center; right: auto; top: auto; transform: none; margin-top: 40px; }
        }
    </style>
</head>
<body>

    <!-- Menú de Navegación -->
    <header>
        <a href="#" class="logo">Coca<span>Cola</span></a>
        <ul class="nav-links">
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Productos</a></li>
            <li><a href="#">Novedades</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </header>

    <!-- Sección Principal -->
    <section class="hero" id="hero-bg">
        <div class="content">
            <h1 id="product-title">Destapa La<br>Felicidad</h1>
            <p id="product-desc">Disfruta del sabor único e inconfundible de siempre. Cada sorbo de tu Coca-Cola Original te conecta con momentos refrescantes llenos de energía y felicidad compartida.</p>
            <div class="btn-container">
                <a href="#" class="btn btn-primary">Comprar Ahora</a>
                <a href="#" class="btn btn-secondary">Ver Más</a>
            </div>
        </div>

        <!-- Imagen Render Principal -->
        <div class="image-box">
            <!-- Usamos imágenes en SVG de alta calidad extraídas de URLs públicas estables -->
            <img src="https://codepen.org" alt="Coca Cola Original" class="main-product" id="product-img">
        </div>

        <!-- Redes Sociales -->
        <div class="sci">
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#"><i class="fa-brands fa-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
        </div>

        <!-- Selector de Productos (Miniaturas) -->
        <div class="thumbnails">
            <div class="thumb active" onclick="changeProduct('original')">
                <img src="https://codepen.org" alt="Original Thumb">
            </div>
            <div class="thumb" onclick="changeProduct('zero')">
                <img src="https://codepen.org" alt="Zero Thumb">
            </div>
        </div>
    </section>

    <!-- Lógica Interactiva con JavaScript -->
    <script>
        // Base de datos de productos para cambiar el contenido de forma dinámica
        const products = {
            original: {
                title: "Destapa La<br>Felicidad",
                desc: "Disfruta del sabor único e inconfundible de siempre. Cada sorbo de tu Coca-Cola Original te conecta con momentos refrescantes llenos de energía y felicidad compartida.",
                img: "https://codepen.org",
                isZero: false
            },
            zero: {
                title: "Zero Azúcar<br>Sabor Al Máximo",
                desc: "Todo el sabor icónico de Coca-Cola que te encanta, pero con cero azúcar y cero calorías. La alternativa perfecta para refrescarte sin remordimientos en cualquier momento del día.",
